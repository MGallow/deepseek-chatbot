[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "deepseek-chatbot"
dynamic = ["version"]
description = "A Streamlit-based chatbot for interacting with DeepSeek-V3 language model"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "MGallow", email = "contact@mgallow.com"},
]
keywords = ["chatbot", "deepseek", "streamlit", "ai", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "flake8>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
deepseek-cli = "deepseek_chatbot.cli:main"
deepseek-chat = "deepseek_chatbot.app:run_app"

[project.urls]
Homepage = "https://github.com/MGallow/deepseek-chatbot"
Repository = "https://github.com/MGallow/deepseek-chatbot"
Issues = "https://github.com/MGallow/deepseek-chatbot/issues"

[tool.hatch.version]
path = "deepseek_chatbot/__init__.py"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=deepseek_chatbot --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
# Same as Black's default line length
line-length = 88
# Enable auto-fixing for all rules
fix = true
# Target Python 3.9+
target-version = "py39"
# Include common file patterns
include = ["*.py", "*.pyi", "**/pyproject.toml"]
# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable common rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle
]
# Ignore specific rules
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D213",  # Multi-line docstring summary should start at the second line
    "D401",  # First line should end with a period
]

# Allow unfixable lint rule violations to be ignored
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements and don't need docstrings
"tests/**/*.py" = ["D", "S101"]
# CLI scripts can have print statements
"**/cli.py" = ["T201"]
"deepseek_cli.py" = ["T201"]
"cli_app.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Use single line for imports
force-single-line = false
# Group imports
known-first-party = ["deepseek_chatbot"]

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.12.4",
]
