[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "deepseek-chatbot"
dynamic = ["version"]
description = "A Streamlit-based chatbot for interacting with DeepSeek-V3 language model"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Your Name", email = "youremail@example.com"},
]
keywords = ["chatbot", "deepseek", "streamlit", "ai", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "azure-ai-inference>=1.0.0b9",
    "streamlit>=1.44.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
deepseek-cli = "deepseek_chatbot.cli:main"
deepseek-chat = "deepseek_chatbot.app:run_app"

[project.urls]
Homepage = "https://github.com/MGallow/deepseek-chatbot"
Repository = "https://github.com/MGallow/deepseek-chatbot"
Issues = "https://github.com/MGallow/deepseek-chatbot/issues"

[tool.hatch.version]
path = "deepseek_chatbot/__init__.py"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=deepseek_chatbot --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
